name: Deploy site and docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'docs-site/**'
      - 'lib/**'
      - 'examples/**'
      - 'EVENTLINE-AXI.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'lib/**'
      - 'examples/**'
      - 'EVENTLINE-AXI.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      # The build fails on a broken link between pages.
      - run: npm run build
        working-directory: docs-site
      - name: Put the docs under /docs/ next to the landing page
        run: |
          mkdir out
          cp -r site/. out/
          cp -r docs-site/dist out/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
